name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Registry is built and valid
        run: |
          npm run registry:build
          git diff --exit-code -- public/r registry.json || (echo "public/r is stale: run npm run registry:build and commit" && exit 1)
      - run: npx vite build

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: shadcn add into a fresh Vite app
        run: node scripts/verify-shadcn-install.mjs
